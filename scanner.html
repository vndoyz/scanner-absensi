<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Scanner Absensi - SDN 8 Mentok</title>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #080b12,
                    #111827
                );

            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 16px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;
            margin-bottom: 14px;
        }

        .title {
            font-size: 21px;
            font-weight: 800;
            margin: 0;
        }

        .subtitle {
            margin-top: 5px;
            color: #94a3b8;
            font-size: 12px;
        }

        /* =========================
           SCANNER
        ========================= */

        .scanner-card {
            background: #0f172a;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 18px;

            padding: 10px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.35);

            overflow: hidden;
        }

        #reader {
            width: 100%;
        }

        #reader video {
            width: 100% !important;
            height: auto !important;
            border-radius: 12px !important;
            object-fit: cover;
        }

        #reader__scan_region {
            border-radius: 12px;
            overflow: hidden;
        }

        #reader__dashboard {
            padding-top: 8px !important;
        }

        #reader__dashboard button {
            background:
                linear-gradient(
                    135deg,
                    #dc2626,
                    #2563eb
                ) !important;

            color: #fff !important;

            border: none !important;

            border-radius: 9px !important;

            padding: 9px 12px !important;

            font-weight: 700 !important;
        }

        #reader__dashboard select {
            background: #111827 !important;
            color: #fff !important;

            border:
                1px solid
                rgba(255,255,255,.15) !important;

            border-radius: 8px !important;
        }

        /* =========================
           STATUS
        ========================= */

        .status-card {
            margin-top: 12px;

            padding: 12px;

            border-radius: 14px;

            text-align: center;

            background: #0f172a;

            border:
                1px solid
                rgba(255,255,255,.08);
        }

        #status {
            font-size: 13px;
            font-weight: 800;
        }

        #statusDetail {
            margin-top: 4px;

            font-size: 11px;

            color: #94a3b8;
        }

        /* =========================
           HASIL SCAN
        ========================= */

        .result {
            display: none;

            margin-top: 12px;

            padding: 15px;

            border-radius: 15px;

            text-align: center;

            background: #0f172a;

            border:
                1px solid
                rgba(34,197,94,.35);
        }

        .result.warning {
            border-color:
                rgba(245,158,11,.45);
        }

        .result.error {
            border-color:
                rgba(239,68,68,.45);
        }

        .result-icon {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .result-name {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.35;
        }

        .result-class {
            margin-top: 4px;
            font-size: 12px;
            color: #cbd5e1;
        }

        .result-time {
            margin-top: 5px;
            font-size: 12px;
            color: #94a3b8;
        }

        .result-message {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 700;
        }

        /* =========================
           HISTORY
        ========================= */

        .history-card {
            margin-top: 12px;

            background: #0f172a;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 16px;

            padding: 12px;
        }

        .history-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 9px;
        }

        .history-title {
            font-size: 14px;
            font-weight: 800;
        }

        .history-count {
            color: #94a3b8;
            font-size: 10px;
        }

        #history {
            display: flex;

            flex-direction: column;

            gap: 8px;

            max-height: 300px;

            overflow-y: auto;
        }

        .history-item {
            padding: 10px;

            border-radius: 11px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.06);
        }

        .history-item.duplicate {
            border-color:
                rgba(245,158,11,.35);
        }

        .history-name {
            font-size: 12px;
            font-weight: 800;
        }

        .history-class {
            margin-top: 3px;
            font-size: 10px;
            color: #cbd5e1;
        }

        .history-info {
            margin-top: 3px;
            font-size: 10px;
            color: #94a3b8;
        }

        .history-status {
            display: inline-block;

            margin-top: 6px;

            padding:
                3px 7px;

            border-radius: 6px;

            font-size: 9px;

            font-weight: 800;

            background:
                rgba(34,197,94,.12);

            color:
                #86efac;
        }

        .history-item.duplicate
        .history-status {

            background:
                rgba(245,158,11,.12);

            color:
                #fcd34d;
        }

        .empty {
            text-align: center;

            color: #64748b;

            padding: 16px;

            font-size: 11px;
        }

        /* =========================
           ERROR
        ========================= */

        #error {
            display: none;

            margin-top: 10px;

            padding: 10px;

            border-radius: 10px;

            background:
                rgba(127,29,29,.35);

            border:
                1px solid
                rgba(248,113,113,.25);

            color: #fecaca;

            font-size: 11px;

            text-align: center;
        }

        #retry {
            display: none;

            width: 100%;

            margin-top: 8px;

            padding: 11px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    #dc2626,
                    #2563eb
                );
        }

        @media(max-width:380px) {

            .container {
                padding: 10px;
            }

            .title {
                font-size: 19px;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="title">
            📷 Scan QR Kehadiran
        </div>

        <div class="subtitle">
            SD Negeri 8 Mentok
        </div>

    </div>


    <!-- SCANNER -->

    <div class="scanner-card">

        <div id="reader"></div>

    </div>


    <!-- STATUS -->

    <div class="status-card">

        <div id="status">
            Menyiapkan kamera...
        </div>

        <div id="statusDetail">
            Mohon izinkan akses kamera.
        </div>

    </div>


    <!-- ERROR -->

    <div id="error"></div>

    <button
        id="retry"
        type="button"
    >
        Coba Lagi
    </button>


    <!-- HASIL -->

    <div
        id="result"
        class="result"
    >

        <div
            id="resultIcon"
            class="result-icon"
        >
            ✓
        </div>

        <div
            id="resultName"
            class="result-name"
        ></div>

        <div
            id="resultClass"
            class="result-class"
        ></div>

        <div
            id="resultTime"
            class="result-time"
        ></div>

        <div
            id="resultMessage"
            class="result-message"
        ></div>

    </div>


    <!-- HISTORY -->

    <div class="history-card">

        <div class="history-header">

            <div class="history-title">
                📋 Absensi Hari Ini
            </div>

            <div
                id="historyCount"
                class="history-count"
            >
                0 siswa
            </div>

        </div>

        <div id="history">

            <div class="empty">
                Belum ada absensi hari ini.
            </div>

        </div>

    </div>

</div>


<script>

/* ============================================================
   VARIABEL
============================================================ */

let scanner = null;

let sedangMemproses = false;


/* ============================================================
   STORAGE
============================================================ */

function getTanggalKey() {

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2,"0") +
        "-" +
        String(d.getDate()).padStart(2,"0")
    );

}


const STORAGE_KEY =
    "absensi_hari_ini_" +
    getTanggalKey();


let history =
    loadHistory();


/* ============================================================
   LOAD HISTORY
============================================================ */

function loadHistory() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!raw) {
            return [];
        }

        const data =
            JSON.parse(raw);

        if (!Array.isArray(data)) {
            return [];
        }

        /*
         * Bersihkan data lama yang memakai
         * nama placeholder "Siswa".
         */

        return data.filter(
            item =>
                item &&
                item.nama &&
                item.nama !== "Siswa" &&
                item.nisn
        );

    } catch (e) {

        console.error(
            "Gagal membaca history:",
            e
        );

        return [];

    }

}


/* ============================================================
   SAVE HISTORY
============================================================ */

function saveHistory() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(history)
        );

    } catch (e) {

        console.error(
            "Gagal menyimpan history:",
            e
        );

    }

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;

}


/* ============================================================
   RENDER HISTORY
============================================================ */

function renderHistory() {

    const container =
        document.getElementById(
            "history"
        );

    const count =
        document.getElementById(
            "historyCount"
        );


    count.textContent =
        history.length +
        " siswa";


    if (!history.length) {

        container.innerHTML =
            `
            <div class="empty">
                Belum ada absensi hari ini.
            </div>
            `;

        return;

    }


    container.innerHTML =
        history
            .map(item => {

                const duplicate =
                    item.duplicate === true;


                return `
                    <div
                        class="history-item
                        ${duplicate ? "duplicate" : ""}"
                    >

                        <div class="history-name">
                            ${escapeHtml(
                                item.nama
                            )}
                        </div>

                        <div class="history-class">
                            ${escapeHtml(
                                item.kelas ||
                                "Kelas belum diketahui"
                            )}
                        </div>

                        <div class="history-info">
                            NISN:
                            ${escapeHtml(
                                item.nisn
                            )}
                        </div>

                        <div class="history-info">
                            🕐
                            ${escapeHtml(
                                item.waktu ||
                                "-"
                            )}
                        </div>

                        <div class="history-status">
                            ${
                                duplicate
                                ? "⚠ SUDAH ABSEN"
                                : "✓ HADIR"
                            }
                        </div>

                    </div>
                `;

            })
            .join("");

}


/* ============================================================
   SIMPAN HASIL ABSENSI
============================================================ */

function saveAttendanceResult(data) {

    if (!data) {
        return;
    }


    const nisn =
        String(
            data.nisn || ""
        ).trim();


    const nama =
        String(
            data.nama || ""
        ).trim();


    /*
     * JANGAN memasukkan data kalau
     * nama kosong.
     *
     * Ini yang mencegah kartu "Siswa".
     */

    if (!nisn || !nama) {

        console.warn(
            "Hasil absensi tidak lengkap:",
            data
        );

        return;

    }


    const record = {

        nisn: nisn,

        nama: nama,

        kelas:
            String(
                data.kelas || ""
            ).trim(),

        waktu:
            String(
                data.waktu || ""
            ).trim(),

        status:
            data.status ||
            "Hadir",

        message:
            data.message ||
            "",

        duplicate:
            !!data.duplicate

    };


    /*
     * Cari siswa berdasarkan NISN.
     */

    const index =
        history.findIndex(
            item =>
                String(item.nisn) ===
                nisn
        );


    if (index >= 0) {

        /*
         * Kalau sudah ada, update.
         */

        history[index] =
            record;

    } else {

        /*
         * Kalau belum ada, masukkan
         * nama asli dari database.
         */

        history.unshift(
            record
        );

    }


    saveHistory();

    renderHistory();

}


/* ============================================================
   TAMPILKAN HASIL
============================================================ */

function showResult(data) {

    const result =
        document.getElementById(
            "result"
        );

    const icon =
        document.getElementById(
            "resultIcon"
        );

    const name =
        document.getElementById(
            "resultName"
        );

    const kelas =
        document.getElementById(
            "resultClass"
        );

    const waktu =
        document.getElementById(
            "resultTime"
        );

    const message =
        document.getElementById(
            "resultMessage"
        );


    result.className =
        "result";


    if (data.duplicate) {

        result.classList.add(
            "warning"
        );

        icon.textContent =
            "⚠";

    } else if (!data.success) {

        result.classList.add(
            "error"
        );

        icon.textContent =
            "✕";

    } else {

        icon.textContent =
            "✓";

    }


    name.textContent =
        data.nama ||
        "Nama siswa tidak ditemukan";


    kelas.textContent =
        data.kelas
            ? "Kelas " + data.kelas
            : "";


    waktu.textContent =
        data.waktu
            ? "🕐 " + data.waktu
            : "";


    message.textContent =
        data.message ||
        (
            data.success
                ? "Absensi berhasil."
                : "Absensi gagal."
        );


    result.style.display =
        "block";

}


/* ============================================================
   STATUS
============================================================ */

function setStatus(
    text,
    detail
) {

    document.getElementById(
        "status"
    ).textContent =
        text || "";


    document.getElementById(
        "statusDetail"
    ).textContent =
        detail || "";

}


/* ============================================================
   ERROR
============================================================ */

function showError(message) {

    const error =
        document.getElementById(
            "error"
        );


    error.textContent =
        message;


    error.style.display =
        "block";


    document.getElementById(
        "retry"
    ).style.display =
        "block";

}


function clearError() {

    document.getElementById(
        "error"
    ).style.display =
        "none";


    document.getElementById(
        "retry"
    ).style.display =
        "none";

}


/* ============================================================
   AMBIL NISN DARI QR
============================================================ */

function extractNisn(decodedText) {

    const text =
        String(
            decodedText || ""
        ).trim();


    if (!text) {
        return "";
    }


    /*
     * Kalau QR berisi URL:
     *
     * https://...?...nisn=123
     *
     * ambil parameter nisn.
     */

    try {

        const url =
            new URL(text);


        const nisn =
            url.searchParams.get("nisn") ||
            url.searchParams.get("NISN");


        if (nisn) {
            return nisn.trim();
        }

    } catch (e) {

        /*
         * Kalau bukan URL,
         * anggap langsung sebagai NISN.
         */

    }


    return text;

}


/* ============================================================
   SCAN QR
============================================================ */

function onScanSuccess(decodedText) {

    /*
     * Jangan memproses QR berulang
     * selama hasil sebelumnya belum kembali.
     */

    if (sedangMemproses) {
        return;
    }


    const nisn =
        extractNisn(
            decodedText
        );


    if (!nisn) {
        return;
    }


    sedangMemproses =
        true;


    clearError();


    /*
     * Tampilkan sementara hanya:
     *
     * QR berhasil dibaca.
     *
     * JANGAN memasukkan "Siswa"
     * ke history.
     */

    setStatus(
        "QR berhasil dibaca ✓",
        "Memeriksa data siswa..."
    );


    showResult({

        success: true,

        nama: "Memproses...",

        kelas: "",

        waktu: "",

        message:
            "NISN " +
            nisn +
            " sedang diperiksa..."

    });


    /*
     * ========================================================
     * INI KOMUNIKASI KE index.html
     * ========================================================
     *
     * index.html kamu memang menunggu:
     *
     * type: "ABSENSI_QR"
     *
     * lalu memanggil Code.gs.
     */

    try {

        if (
            window.opener &&
            !window.opener.closed
        ) {

            window.opener.postMessage(

                {
                    type:
                        "ABSENSI_QR",

                    value:
                        nisn
                },

                "*"

            );


            setStatus(
                "Memeriksa siswa...",
                "Menunggu hasil dari aplikasi utama."
            );


        } else {

            /*
             * Kalau opener hilang,
             * hasil memang tidak akan pernah kembali.
             */

            showError(
                "Scanner tidak terhubung dengan aplikasi utama. " +
                "Tutup scanner lalu buka kembali melalui tombol Scan QR."
            );


            setStatus(
                "Koneksi aplikasi utama tidak ditemukan.",
                "Buka scanner dari aplikasi absensi."
            );


            sedangMemproses =
                false;

        }

    } catch (error) {

        console.error(
            "Gagal mengirim QR:",
            error
        );


        showError(
            "Gagal mengirim data QR ke aplikasi utama."
        );


        sedangMemproses =
            false;

    }

}


/* ============================================================
   TERIMA HASIL DARI index.html
============================================================ */

window.addEventListener(
    "message",
    function(event) {

        if (
            !event ||
            !event.data
        ) {
            return;
        }


        const data =
            event.data;


        /*
         * Kita hanya menerima pesan:
         *
         * ABSENSI_RESULT
         */

        if (
            data.type !==
            "ABSENSI_RESULT"
        ) {

            return;

        }


        console.log(
            "ABSENSI_RESULT diterima:",
            data
        );


        /*
         * ====================================================
         * HASIL SUDAH KEMBALI
         * ====================================================
         */

        sedangMemproses =
            false;


        /*
         * Simpan HANYA kalau nama
         * memang dikirim.
         */

        if (
            data.nama &&
            String(data.nama).trim()
        ) {

            saveAttendanceResult(
                data
            );

        }


        /*
         * Tampilkan hasil lengkap.
         */

        showResult(
            data
        );


        /*
         * DUPLICATE
         */

        if (data.duplicate) {

            setStatus(
                "⚠ Siswa sudah absen",
                data.message ||
                (
                    data.nama
                        ? data.nama +
                          " sudah tercatat."
                        : "Sudah tercatat."
                )
            );


        /*
         * BERHASIL
         */

        } else if (data.success) {

            setStatus(
                "✓ Absensi berhasil",
                (
                    data.nama ||
                    "Siswa"
                ) +
                (
                    data.waktu
                        ? " • " +
                          data.waktu
                        : ""
                )
            );


        /*
         * GAGAL
         */

        } else {

            setStatus(
                "✕ Absensi gagal",
                data.message ||
                "Data tidak dapat diproses."
            );

        }

    },
    false
);


/* ============================================================
   NOTIFIKASI SCANNER SIAP
============================================================ */

function notifyReady() {

    try {

        if (
            window.opener &&
            !window.opener.closed
        ) {

            window.opener.postMessage(

                {
                    type:
                        "ABSENSI_SCANNER_READY"
                },

                "*"

            );

        }

    } catch (e) {

        console.warn(
            "Tidak dapat mengirim status ready:",
            e
        );

    }

}


/* ============================================================
   START SCANNER
============================================================ */

async function startScanner() {

    clearError();


    setStatus(
        "Menyiapkan kamera...",
        "Mohon izinkan akses kamera."
    );


    try {

        if (
            typeof Html5Qrcode ===
            "undefined"
        ) {

            throw new Error(
                "Library QR scanner belum dimuat."
            );

        }


        scanner =
            new Html5Qrcode(
                "reader"
            );


        const config = {

            fps: 10,

            qrbox:
                function(
                    width,
                    height
                ) {

                    const size =
                        Math.floor(
                            Math.min(
                                width,
                                height
                            ) * .7
                        );


                    return {

                        width:
                            Math.max(
                                180,
                                size
                            ),

                        height:
                            Math.max(
                                180,
                                size
                            )

                    };

                }

        };


        /*
         * Utamakan kamera belakang.
         */

        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            config,

            onScanSuccess,

            function() {}

        );


        setStatus(
            "Kamera siap ✓",
            "Arahkan QR siswa ke kotak scanner."
        );


        notifyReady();


    } catch (firstError) {

        console.warn(
            "Kamera belakang gagal:",
            firstError
        );


        /*
         * Fallback.
         */

        try {

            const cameras =
                await Html5Qrcode.getCameras();


            if (
                !cameras ||
                !cameras.length
            ) {

                throw new Error(
                    "Kamera tidak ditemukan."
                );

            }


            scanner =
                new Html5Qrcode(
                    "reader"
                );


            await scanner.start(

                cameras[0].id,

                {
                    fps: 10,

                    qrbox:
                        function(
                            width,
                            height
                        ) {

                            const size =
                                Math.floor(
                                    Math.min(
                                        width,
                                        height
                                    ) * .7
                                );


                            return {

                                width:
                                    Math.max(
                                        180,
                                        size
                                    ),

                                height:
                                    Math.max(
                                        180,
                                        size
                                    )

                            };

                        }

                },

                onScanSuccess,

                function() {}

            );


            setStatus(
                "Kamera siap ✓",
                "Arahkan QR siswa ke kotak scanner."
            );


            notifyReady();


        } catch (error) {

            console.error(
                "Kamera gagal:",
                error
            );


            showError(
                "Kamera tidak dapat dibuka. " +
                "Pastikan izin kamera diberikan."
            );


            setStatus(
                "Kamera gagal dibuka",
                "Tekan Coba Lagi."
            );

        }

    }

}


/* ============================================================
   RETRY
============================================================ */

document
    .getElementById("retry")
    .addEventListener(
        "click",
        async function() {

            try {

                if (scanner) {

                    await scanner.stop();

                    scanner.clear();

                }

            } catch (e) {}


            scanner =
                null;


            sedangMemproses =
                false;


            document.getElementById(
                "result"
            ).style.display =
                "none";


            startScanner();

        }
    );


/* ============================================================
   INIT
============================================================ */

renderHistory();

notifyReady();

startScanner();

</script>
