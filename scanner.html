<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Absensi - SDN 8 Mentok</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #fff;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 480px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 800;
        }
        .header p {
            color: #94a3b8;
            font-size: 11px;
            margin-top: 2px;
        }

        .card {
            background: #1e293b;
            border-radius: 14px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        #reader {
            width: 100%;
        }
        #reader video {
            width: 100% !important;
            height: auto !important;
            border-radius: 10px !important;
            aspect-ratio: 1/1 !important;
            object-fit: cover !important;
            background: #000;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-group button {
            padding: 12px 8px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
        }
        .btn-group button:active {
            transform: scale(0.96);
        }
        .btn-belakang {
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
        }
        .btn-belakang:hover {
            box-shadow: 0 6px 25px rgba(5, 150, 105, 0.5);
            transform: translateY(-2px);
        }
        .btn-depan {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        .btn-depan:hover {
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }

        .btn-stop {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-stop:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .status-box {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        .status-box .status {
            font-size: 13px;
            font-weight: 700;
        }
        .status-box .detail {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 3px;
        }
        .status-led {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
        .status-led.on {
            background: #4ade80;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }
        .status-led.off {
            background: #475569;
        }

        .result {
            display: none;
            margin-top: 10px;
            padding: 14px;
            border-radius: 10px;
            background: #1e293b;
            text-align: center;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .result.success {
            border-color: rgba(34, 197, 94, 0.4);
        }
        .result.duplicate {
            border-color: rgba(245, 158, 11, 0.4);
        }
        .result.error {
            border-color: rgba(239, 68, 68, 0.4);
        }
        .result .nama {
            font-size: 17px;
            font-weight: 800;
            margin-top: 3px;
        }
        .result .kelas {
            font-size: 12px;
            color: #94a3b8;
        }
        .result .waktu {
            font-size: 10px;
            color: #64748b;
            margin-top: 3px;
        }
        .result .pesan {
            font-size: 11px;
            font-weight: 700;
            margin-top: 5px;
        }

        .history {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .history-header h3 {
            font-size: 13px;
            font-weight: 700;
        }
        .history-header span {
            font-size: 10px;
            color: #94a3b8;
        }
        #historyList {
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .history-item {
            padding: 7px 9px;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .history-item .h-nama {
            font-size: 12px;
            font-weight: 700;
        }
        .history-item .h-info {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .history-item .h-badge {
            display: inline-block;
            margin-top: 3px;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 8px;
            font-weight: 700;
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
        }
        .history-item.duplicate .h-badge {
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
        }
        .history-empty {
            text-align: center;
            padding: 16px;
            color: #64748b;
            font-size: 11px;
        }

        #error {
            display: none;
            margin-top: 6px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(127, 29, 29, 0.35);
            border: 1px solid rgba(248, 113, 113, 0.25);
            color: #fca5a5;
            font-size: 11px;
            text-align: center;
        }
        #retry {
            display: none;
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #dc2626, #2563eb);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
        #retry:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>📷 Scan QR Kehadiran</h1>
        <p>SD Negeri 8 Mentok</p>
    </div>

    <div class="card">
        <div id="reader"></div>
    </div>

    <div class="btn-group">
        <button class="btn-belakang" id="btnRear">Kamera Belakang</button>
        <button class="btn-depan" id="btnFront">Kamera Depan</button>
    </div>

    <button class="btn-stop" id="btnStop">Stop Scanner</button>

    <div class="status-box">
        <div class="status" id="status">Menyiapkan kamera...</div>
        <div class="detail" id="detail">Mohon izinkan akses kamera.</div>
        <div style="margin-top:4px; font-size:10px; color:#64748b;">
            <span class="status-led off" id="statusLed"></span>
            <span id="statusText">Kamera mati</span>
        </div>
    </div>

    <div id="error"></div>
    <button id="retry">Coba Lagi</button>

    <div id="result" class="result">
        <div id="resultIcon" style="font-size:24px;">✅</div>
        <div class="nama" id="resultName"></div>
        <div class="kelas" id="resultClass"></div>
        <div class="waktu" id="resultTime"></div>
        <div class="pesan" id="resultMessage"></div>
    </div>

    <div class="history">
        <div class="history-header">
            <h3>📋 Absensi Hari Ini</h3>
            <span id="historyCount">0 siswa</span>
        </div>
        <div id="historyList">
            <div class="history-empty">Belum ada absensi hari ini.</div>
        </div>
    </div>

</div>

<script>
    // ============================================================
    // VARIABEL
    // ============================================================
    let qrScanner = null;
    let processing = false;
    let lastNisn = "";
    let lastSendTime = 0;
    let waitingTimer = null;
    let currentMode = 'environment';

    // ============================================================
    // STORAGE
    // ============================================================
    function getToday() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    const STORAGE_KEY = 'absensi_scanner_' + getToday();
    let history = loadHistory();

    function loadHistory() {
        try {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            return Array.isArray(data) ? data.filter(item => item && item.nisn && item.nama) : [];
        } catch (e) { return []; }
    }

    function saveHistory() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    function esc(v) {
        const d = document.createElement('div');
        d.textContent = v == null ? '' : String(v);
        return d.innerHTML;
    }

    // ============================================================
    // RENDER HISTORY
    // ============================================================
    function renderHistory() {
        const list = document.getElementById('historyList');
        const count = document.getElementById('historyCount');
        count.textContent = history.length + ' siswa';

        if (history.length === 0) {
            list.innerHTML = '<div class="history-empty">Belum ada absensi hari ini.</div>';
            return;
        }

        list.innerHTML = history.map(item => `
            <div class="history-item ${item.duplicate ? 'duplicate' : ''}">
                <div class="h-nama">${esc(item.nama)}</div>
                <div class="h-info">${esc(item.kelas || '')} • NISN: ${esc(item.nisn)}</div>
                <div class="h-info">🕐 ${esc(item.waktu || '-')}</div>
                <span class="h-badge">${item.duplicate ? '⚠ Sudah Absen' : '✅ Hadir'}</span>
            </div>
        `).join('');
    }

    // ============================================================
    // STATUS
    // ============================================================
    function setStatus(text, detail) {
        document.getElementById('status').textContent = text || '';
        document.getElementById('detail').textContent = detail || '';
    }

    function setLed(on) {
        const led = document.getElementById('statusLed');
        const txt = document.getElementById('statusText');
        led.className = 'status-led ' + (on ? 'on' : 'off');
        txt.textContent = on ? 'Kamera menyala' : 'Kamera mati';
    }

    function showError(text) {
        const el = document.getElementById('error');
        el.textContent = text;
        el.style.display = 'block';
        document.getElementById('retry').style.display = 'block';
    }

    function clearError() {
        document.getElementById('error').style.display = 'none';
        document.getElementById('retry').style.display = 'none';
    }

    // ============================================================
    // RESULT
    // ============================================================
    function showResult(data) {
        const box = document.getElementById('result');
        box.className = 'result';

        const icon = document.getElementById('resultIcon');
        if (data.duplicate) {
            box.classList.add('duplicate');
            icon.textContent = '⚠️';
        } else if (!data.success) {
            box.classList.add('error');
            icon.textContent = '❌';
        } else {
            box.classList.add('success');
            icon.textContent = '✅';
        }

        document.getElementById('resultName').textContent = data.nama || 'Siswa tidak ditemukan';
        document.getElementById('resultClass').textContent = data.kelas ? 'Kelas ' + data.kelas : '';
        document.getElementById('resultTime').textContent = data.waktu ? '🕐 ' + data.waktu : '';
        document.getElementById('resultMessage').textContent = data.message || '';
        box.style.display = 'block';
    }

    // ============================================================
    // SIMPAN HASIL
    // ============================================================
    function saveResult(data) {
        if (!data || !data.nisn || !data.nama) return;

        const nisn = String(data.nisn).trim();
        const record = {
            nisn: nisn,
            nama: String(data.nama).trim(),
            kelas: String(data.kelas || '').trim(),
            waktu: String(data.waktu || '').trim(),
            duplicate: !!data.duplicate
        };

        const idx = history.findIndex(item => String(item.nisn) === nisn);
        if (idx >= 0) history[idx] = record;
        else history.unshift(record);

        saveHistory();
        renderHistory();
    }

    // ============================================================
    // AMBIL NISN DARI QR
    // ============================================================
    function getNisn(text) {
        text = String(text || '').trim();
        if (!text) return '';

        try {
            const url = new URL(text);
            const nisn = url.searchParams.get('nisn') || url.searchParams.get('NISN');
            if (nisn) return nisn.trim();
        } catch (e) {}

        if (/^\d+$/.test(text)) return text;

        return text;
    }

    // ============================================================
    // KIRIM KE APLIKASI UTAMA - 3 CARA
    // ============================================================
    function sendToIndex(nisn) {
        let sent = false;
        console.log('📤 Mengirim NISN:', nisn);

        // CARA 1: POST MESSAGE
        if (window.opener && !window.opener.closed) {
            try {
                window.opener.postMessage({
                    type: 'ABSENSI_QR',
                    value: nisn,
                    time: Date.now()
                }, '*');
                console.log('✅ Cara 1 (postMessage) berhasil');
                sent = true;
            } catch (e) {
                console.warn('Cara 1 gagal:', e);
            }
        }

        // CARA 2: URL PARAMETER
        if (!sent && window.opener && !window.opener.closed) {
            try {
                const parentUrl = window.opener.location.href;
                const separator = parentUrl.includes('?') ? '&' : '?';
                const newUrl = parentUrl + separator + 'nisn=' + encodeURIComponent(nisn) + '&source=scanner';
                console.log('✅ Cara 2 (URL) siap:', newUrl);
                sent = true;
            } catch (e) {
                console.warn('Cara 2 gagal:', e);
            }
        }

        // CARA 3: LocalStorage
        if (!sent) {
            try {
                localStorage.setItem('scanner_nisn', nisn);
                localStorage.setItem('scanner_time', Date.now());
                console.log('✅ Cara 3 (localStorage) berhasil');
                sent = true;
            } catch (e) {
                console.warn('Cara 3 gagal:', e);
            }
        }

        if (!sent) {
            showError('Tidak dapat mengirim QR ke aplikasi utama.');
            setStatus('❌ Gagal kirim', 'Tutup scanner dan buka ulang dari aplikasi.');
        }

        return sent;
    }

    // ============================================================
    // SCAN SUCCESS
    // ============================================================
    function onScanSuccess(decodedText) {
        if (processing) return;

        const nisn = getNisn(decodedText);
        if (!nisn) {
            console.warn('NISN tidak valid:', decodedText);
            return;
        }

        const now = Date.now();
        if (nisn === lastNisn && now - lastSendTime < 2000) return;

        lastNisn = nisn;
        lastSendTime = now;
        processing = true;

        clearError();
        document.getElementById('result').style.display = 'none';
        setStatus('QR terbaca ✅', 'NISN: ' + nisn);

        const tempBox = document.getElementById('result');
        tempBox.style.display = 'block';
        tempBox.className = 'result';
        document.getElementById('resultIcon').textContent = '📤';
        document.getElementById('resultName').textContent = 'NISN: ' + nisn;
        document.getElementById('resultClass').textContent = '⏳ Mengirim data...';
        document.getElementById('resultTime').textContent = '';
        document.getElementById('resultMessage').textContent = 'Mohon tunggu...';

        if (!sendToIndex(nisn)) {
            processing = false;
            return;
        }

        setStatus('Menunggu respon...', 'Aplikasi utama sedang memproses...');

        clearTimeout(waitingTimer);
        waitingTimer = setTimeout(() => {
            if (!processing) return;

            try {
                const storedNisn = localStorage.getItem('scanner_nisn');
                const storedTime = parseInt(localStorage.getItem('scanner_time') || '0');
                if (storedNisn === nisn && (Date.now() - storedTime) < 5000) {
                    const data = JSON.parse(localStorage.getItem('scanner_result') || '{}');
                    if (data && data.nama) {
                        handleResult(data);
                        return;
                    }
                }
            } catch (e) {}

            setStatus('Timeout ⏰', 'Aplikasi utama tidak merespon.');
            showError('Aplikasi utama tidak merespon. Coba scan ulang.');
            processing = false;
        }, 10000);
    }

    // ============================================================
    // HANDLE RESULT
    // ============================================================
    function handleResult(data) {
        clearTimeout(waitingTimer);
        processing = false;

        console.log('✅ Hasil absensi:', data);

        saveResult(data);
        showResult(data);

        if (data.duplicate) {
            setStatus('⚠ Sudah absen', data.message || data.nama + ' sudah absen.');
        } else if (data.success) {
            setStatus('✅ Absensi berhasil', (data.nama || 'Siswa') + (data.waktu ? ' • ' + data.waktu : ''));
        } else {
            setStatus('❌ Gagal', data.message || 'Data tidak valid.');
        }
    }

    // ============================================================
    // TERIMA HASIL DARI INDEX (POST MESSAGE)
    // ============================================================
    window.addEventListener('message', function(event) {
        if (!event || !event.data) return;
        if (event.data.type !== 'ABSENSI_RESULT') return;
        handleResult(event.data);
    });

    // ============================================================
    // CEK LOCALSTORAGE
    // ============================================================
    function checkLocalStorage() {
        try {
            const nisn = localStorage.getItem('scanner_nisn');
            const time = parseInt(localStorage.getItem('scanner_time') || '0');
            if (nisn && (Date.now() - time) < 5000) {
                const data = JSON.parse(localStorage.getItem('scanner_result') || '{}');
                if (data && data.nama) {
                    handleResult(data);
                    localStorage.removeItem('scanner_nisn');
                    localStorage.removeItem('scanner_time');
                    localStorage.removeItem('scanner_result');
                }
            }
        } catch (e) {}
    }

    setInterval(checkLocalStorage, 2000);

    // ============================================================
    // START SCANNER
    // ============================================================
    async function startScanner(mode) {
        currentMode = mode || currentMode;
        clearError();
        setStatus('Menyiapkan kamera...', 'Mohon izinkan akses kamera.');
        setLed(false);

        try {
            if (typeof Html5Qrcode === 'undefined') {
                throw new Error('Library scanner tidak tersedia.');
            }

            if (qrScanner) {
                try { await qrScanner.stop();
                    qrScanner.clear(); } catch (e) {}
                qrScanner = null;
            }

            qrScanner = new Html5Qrcode('reader');

            const config = {
                fps: 15,
                qrbox: function(width, height) {
                    const size = Math.max(200, Math.floor(Math.min(width, height) * 0.7));
                    return { width: size, height: size };
                }
            };

            await qrScanner.start({ facingMode: mode }, config, onScanSuccess, function() {});

            const label = mode === 'user' ? 'Depan' : 'Belakang';
            setStatus('Kamera ' + label + ' siap ✅', 'Arahkan QR ke kotak scanner.');
            setLed(true);

            try {
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'ABSENSI_SCANNER_READY' }, '*');
                }
            } catch (e) {}

        } catch (error) {
            console.error('Kamera error:', error);

            if (mode === 'environment') {
                setStatus('Kamera belakang gagal', 'Mencoba kamera depan...');
                setTimeout(() => { startScanner('user'); }, 500);
                return;
            }

            showError('Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.');
            setStatus('Gagal buka kamera', 'Tekan "Coba Lagi"');
            setLed(false);
        }
    }

    // ============================================================
    // STOP SCANNER
    // ============================================================
    async function stopScanner() {
        try {
            if (qrScanner) {
                await qrScanner.stop();
                qrScanner.clear();
            }
        } catch (e) {}
        qrScanner = null;
        setStatus('Scanner dihentikan', '');
        setLed(false);
        document.getElementById('result').style.display = 'none';
    }

    // ============================================================
    // EVENT TOMBOL
    // ============================================================
    document.getElementById('btnRear').addEventListener('click', function() {
        startScanner('environment');
    });

    document.getElementById('btnFront').addEventListener('click', function() {
        startScanner('user');
    });

    document.getElementById('btnStop').addEventListener('click', function() {
        stopScanner();
    });

    document.getElementById('retry').addEventListener('click', function() {
        startScanner(currentMode);
    });

    // ============================================================
    // PARAMETER URL
    // ============================================================
    const urlParams = new URLSearchParams(window.location.search);
    const cameraParam = urlParams.get('camera');

    // ============================================================
    // INIT - LANGSUNG BUKA KAMERA
    // ============================================================
    renderHistory();
    setStatus('Menyiapkan kamera...', 'Mohon izinkan akses kamera.');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError('Browser tidak mendukung kamera. Gunakan Chrome terbaru.');
        setStatus('Tidak didukung', 'Browser tidak support kamera.');
    } else {
        if (cameraParam === 'front') {
            setTimeout(() => { startScanner('user'); }, 400);
        } else {
            setTimeout(() => { startScanner('environment'); }, 400);
        }
    }

    window.closeScanner = function() {
        stopScanner();
        window.close();
    };
</script>

</body>
</html>
