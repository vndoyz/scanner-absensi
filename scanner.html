<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scanner QR Kehadiran</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
/* =========================================================
   TEMA SCANNER DISAMAKAN DENGAN WEB UTAMA
   ========================================================= */

:root{
  --spidey-red:#dc2626;
  --spidey-red-dark:#991b1b;
  --spidey-blue:#1d4ed8;
  --spidey-blue-dark:#1e3a8a;
  --bg:#05060a;
  --panel-top:rgba(17,19,29,.96);
  --panel-bottom:rgba(8,9,15,.98);
  --border:rgba(148,163,184,.14);
  --muted:#94a3b8;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background-color:var(--bg);
  color:#fff;
}

body{
  font-family:'Inter',Arial,sans-serif;

  /* Background yang sama dengan index.html */
  background-image:
    radial-gradient(
      circle at 12% 15%,
      rgba(220,38,38,.18),
      transparent 42%
    ),
    radial-gradient(
      circle at 88% 85%,
      rgba(29,78,216,.22),
      transparent 46%
    ),
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 64px
    ),
    repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 64px
    );

  background-attachment:fixed;
  background-size:cover;
  min-height:100vh;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
  transition:.18s ease;
}

button:active{
  transform:scale(.97);
}

.wrap{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:16px;
}

/* Header */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

h1{
  margin:0;
  font-size:20px;
  font-weight:800;
  letter-spacing:-.02em;
}

.sub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

/* Tombol kembali */

#back{
  color:#fff;
  background:
    linear-gradient(
      135deg,
      rgba(220,38,38,.9),
      rgba(29,78,216,.9)
    );
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}

#back:hover{
  filter:brightness(1.1);
}

/* Kartu umum */

.card,
.status,
.history-wrap{
  background:
    linear-gradient(
      180deg,
      var(--panel-top),
      var(--panel-bottom)
    );
  border:1px solid var(--border);
  box-shadow:
    0 12px 30px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.025);
  backdrop-filter:blur(10px);
}

/* Scanner */

.card{
  border-radius:18px;
  padding:10px;
  overflow:hidden;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:12px;
}

/* Area video html5-qrcode */

#reader video{
  width:100%!important;
  height:auto!important;
  min-height:250px;
  object-fit:cover;
  border-radius:12px!important;
}

/* Beberapa elemen bawaan html5-qrcode */
#reader__scan_region{
  border-radius:12px;
  overflow:hidden;
}

#reader__dashboard{
  color:#cbd5e1!important;
  padding-top:8px!important;
}

#reader__dashboard button{
  color:#fff!important;
  background:
    linear-gradient(
      120deg,
      var(--spidey-red),
      var(--spidey-blue)
    )!important;
  border:0!important;
  border-radius:9px!important;
}

#reader__dashboard select{
  background:#11131d!important;
  color:#fff!important;
  border:1px solid rgba(148,163,184,.2)!important;
  border-radius:8px!important;
}

/* Status */

.status{
  margin-top:12px;
  text-align:center;
  padding:12px;
  border-radius:14px;
}

#status{
  font-size:13px;
  font-weight:700;
}

#hint{
  font-size:10px;
  color:var(--muted);
  margin-top:5px;
}

/* Error */

#error{
  display:none;
  margin-top:10px;
  padding:11px;
  border-radius:12px;
  background:rgba(127,29,29,.35);
  border:1px solid rgba(248,113,113,.22);
  color:#fecaca;
  font-size:12px;
}

#retry{
  display:none;
  width:100%;
  margin-top:9px;
  color:#fff;
  background:
    linear-gradient(
      120deg,
      var(--spidey-red),
      var(--spidey-blue)
    );
}

/* Hasil scan */

#result{
  display:none;
  margin-top:12px;
  text-align:center;
  padding:14px;
  border-radius:14px;

  background:
    linear-gradient(
      180deg,
      rgba(17,19,29,.96),
      rgba(8,9,15,.98)
    );

  border:1px solid rgba(34,197,94,.28);
  box-shadow:0 10px 28px rgba(0,0,0,.2);
}

#resultText{
  font-weight:800;
  font-size:14px;
  line-height:1.45;
}

/* History */

.history-wrap{
  margin-top:12px;
  border-radius:18px;
  padding:12px;
}

.history-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.history-title{
  font-size:14px;
  font-weight:800;
}

.history-count{
  font-size:10px;
  color:var(--muted);
}

.history-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  max-height:300px;
  overflow-y:auto;
  padding-right:2px;
}

.history-card{
  background:
    linear-gradient(
      180deg,
      rgba(17,19,29,.95),
      rgba(8,9,15,.98)
    );
  border:1px solid rgba(148,163,184,.12);
  border-radius:12px;
  padding:9px;
  min-height:88px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}

.history-name{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-nisn{
  font-size:10px;
  color:var(--muted);
  margin-top:4px;
  word-break:break-all;
}

.history-time{
  font-size:10px;
  color:var(--muted);
  margin-top:4px;
}

.empty-history{
  grid-column:1/-1;
  text-align:center;
  color:#64748b;
  padding:18px 8px;
  font-size:11px;
}

/* Scrollbar mengikuti nuansa web utama */

.history-list::-webkit-scrollbar{
  width:5px;
}

.history-list::-webkit-scrollbar-track{
  background:rgba(255,255,255,.02);
}

.history-list::-webkit-scrollbar-thumb{
  background:
    linear-gradient(
      var(--spidey-red),
      var(--spidey-blue)
    );
  border-radius:20px;
}

/* HP */

@media(max-width:380px){

  .wrap{
    padding:10px;
  }

  h1{
    font-size:18px;
  }

  .history-list{
    grid-template-columns:1fr;
  }

  #reader video{
    min-height:220px;
  }
}

/* Pastikan scanner tetap portrait-friendly */
@media(orientation:landscape) and (max-height:600px){
  .wrap{
    max-width:700px;
    padding:8px 14px;
  }

  .history-list{
    max-height:180px;
  }

  #reader video{
    max-height:48vh;
    object-fit:cover;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>📷 Scan QR Kehadiran</h1>
      <div class="sub">Arahkan QR siswa ke kamera</div>
    </div>
    <button id="back" type="button">Kembali</button>
  </div>

  <div class="card">
    <div id="reader"></div>
  </div>

  <div class="status">
    <div id="status">Membuka kamera...</div>
    <div id="hint">Izinkan akses kamera jika diminta.</div>
  </div>

  <div id="error"></div>
  <button id="retry" type="button">Coba Lagi</button>

  <div id="result">
    <div style="font-size:26px">✓</div>
    <div id="resultText"></div>
  </div>

  <div class="history-wrap">
    <div class="history-head">
      <div class="history-title">📋 Absensi Hari Ini</div>
      <div id="historyCount" class="history-count">0 siswa</div>
    </div>
    <div id="historyList" class="history-list"></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIJwq8jk0XX_1KuYEWzMLJXNxdfLOxAfsSUHc91R1BYH4J_TdnRYWjKrR2Mn55pR8K1Q/exec";

let qrScanner = null;
let processing = false;
let todayKey = getTodayKey();
let historyKey = "absensi_history_" + todayKey;
let attendanceHistory = loadHistory();

function getTodayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function setStatus(text,hint){
  document.getElementById("status").textContent=text;
  document.getElementById("hint").textContent=hint || "";
}

function showError(text){
  const e=document.getElementById("error");
  e.textContent=text;
  e.style.display="block";
  document.getElementById("retry").style.display="block";
}

function clearError(){
  document.getElementById("error").style.display="none";
  document.getElementById("retry").style.display="none";
}

function loadHistory(){
  try{
    const raw=localStorage.getItem(historyKey);
    if(!raw)return [];
    const parsed=JSON.parse(raw);
    return Array.isArray(parsed)?parsed:[];
  }catch(e){
    console.warn("History tidak dapat dibaca:",e);
    return [];
  }
}

function saveHistory(){
  try{
    localStorage.setItem(historyKey,JSON.stringify(attendanceHistory));
  }catch(e){
    console.warn("History tidak dapat disimpan:",e);
  }
}

function escapeHtml(value){
  const el=document.createElement("div");
  el.textContent=String(value==null?"":value);
  return el.innerHTML;
}

function renderHistory(){
  const list=document.getElementById("historyList");
  document.getElementById("historyCount").textContent=attendanceHistory.length+" siswa";

  if(!attendanceHistory.length){
    list.innerHTML='<div class="empty-history">Belum ada siswa yang discan hari ini.</div>';
    return;
  }

  list.innerHTML=attendanceHistory.map(function(item){
    return `
      <div class="history-card">
        <div class="history-name">${escapeHtml(item.nama || "Nama tidak ditemukan")}</div>
        <div class="history-nisn">${escapeHtml(item.kelas || "Kelas belum diketahui")} · NISN: ${escapeHtml(item.nisn)}</div>
        <div class="history-time">🕐 ${escapeHtml(item.time || "-")}</div>
      </div>`;
  }).join("");
}

function addHistory(nisn){
  if(attendanceHistory.some(function(item){return item.nisn===nisn;})){
    return false;
  }

  attendanceHistory.unshift({
    nisn:nisn,
    nama:"Siswa",
    time:new Date().toLocaleTimeString("id-ID",{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    })
  });

  saveHistory();
  renderHistory();
  return true;
}

function getNisn(raw){
  const text=String(raw||"").trim();
  if(!text)return "";

  try{
    const url=new URL(text);
    return String(
      url.searchParams.get("nisn") ||
      url.searchParams.get("NISN") ||
      text
    ).trim();
  }catch(e){
    return text;
  }
}

async function stopScanner(){
  const scanner=qrScanner;
  qrScanner=null;

  if(!scanner)return;

  try{await scanner.stop();}catch(e){}
  try{scanner.clear();}catch(e){}
}

async function startScanner(){
  processing=false;
  clearError();
  document.getElementById("result").style.display="none";

  setStatus("Membuka kamera...","Izinkan akses kamera jika diminta.");

  await stopScanner();

  if(typeof Html5Qrcode!=="function"){
    showError("Library scanner gagal dimuat. Pastikan internet aktif lalu tekan Coba Lagi.");
    return;
  }

  const scanner=new Html5Qrcode("reader");
  qrScanner=scanner;

  const config={
    fps:10,
    qrbox:function(w,h){
      const size=Math.max(180,Math.floor(Math.min(w,h)*0.7));
      return {width:size,height:size};
    }
  };

  try{
    await scanner.start(
      {facingMode:"environment"},
      config,
      onScan,
      function(){}
    );

    if(qrScanner===scanner){
      setStatus("Kamera siap","Arahkan QR siswa ke kotak scanner.");
    }
    return;

  }catch(firstError){
    console.warn("Kamera environment gagal:",firstError);
  }

  try{
    const cameras=await Html5Qrcode.getCameras();

    if(!cameras || !cameras.length){
      throw new Error("NotFoundError");
    }

    await scanner.start(
      cameras[0].id,
      config,
      onScan,
      function(){}
    );

    if(qrScanner===scanner){
      setStatus("Kamera siap","Arahkan QR siswa ke kotak scanner.");
    }

  }catch(err){
    const msg=String(err && (err.message || err.name) || err || "");

    if(/NotAllowed|Permission|denied/i.test(msg)){
      showError("Akses kamera ditolak. Izinkan kamera untuk halaman scanner ini lalu tekan Coba Lagi.");
    }else if(/NotFound|No camera/i.test(msg)){
      showError("Kamera tidak ditemukan pada perangkat.");
    }else{
      showError("Kamera tidak dapat dibuka. Pastikan scanner dibuka melalui HTTPS.");
      console.error("Detail kamera:",err);
    }
  }
}

async function onScan(decodedText){
  if(processing)return;

  const nisn=getNisn(decodedText);
  if(!nisn)return;

  processing=true;

  // Simpan hasil scan langsung di scanner.html.
  const isNew=addHistory(nisn);

  document.getElementById("result").style.display="block";
  document.getElementById("resultText").textContent =
    isNew
      ? "NISN terbaca: "+nisn
      : "NISN "+nisn+" sudah ada di Absensi Hari Ini";

  /*
   * Kirim ke INDEX yang membuka popup.
   *
   * Penting:
   * - Scanner tidak menunggu balasan dari index.
   * - Scanner tidak menghentikan kamera.
   * - Scanner tidak menutup popup.
   */
  if(window.opener && !window.opener.closed){
    try{
      window.opener.postMessage(
        {
          type:"ABSENSI_QR",
          value:nisn
        },
        "*"
      );

      setStatus(
        isNew ? "QR berhasil dibaca ✓" : "Siswa sudah tercatat",
        "Data dikirim ke aplikasi. Kamera tetap aktif."
      );

    }catch(e){
      console.error("Gagal mengirim NISN ke index:",e);

      setStatus(
        "QR berhasil dibaca ✓",
        "Hasil tersimpan di Absensi Hari Ini."
      );
    }
  }else{
    /*
     * Jika scanner dibuka langsung dari URL GitHub,
     * tidak ada window.opener. Ini bukan error scanner.
     */
    setStatus(
      "QR berhasil dibaca ✓",
      "Hasil tersimpan di Absensi Hari Ini. Buka scanner dari index untuk mengirim ke aplikasi."
    );
  }

  // Jeda singkat agar satu QR tidak terbaca berkali-kali.
  // Kamera TETAP hidup.
  setTimeout(function(){
    processing=false;
    clearError();
    setStatus(
      "Kamera siap",
      "Arahkan QR siswa berikutnya ke kotak scanner."
    );
  },1200);
}

document.getElementById("retry").addEventListener("click",function(){
  startScanner();
});

document.getElementById("back").addEventListener("click",async function(){
  await stopScanner();

  if(window.opener && !window.opener.closed){
    try{window.close();}catch(e){}
  }else{
    window.location.href=APPS_SCRIPT_URL;
  }
});


window.addEventListener("message",function(event){
  if(!event || !event.data || event.data.type!=="ABSENSI_RESULT") return;

  const data=event.data;
  const nisn=String(data.nisn||"").trim();
  if(!nisn)return;

  const item=attendanceHistory.find(function(x){return x.nisn===nisn;});

  if(item){
    item.nama=data.nama || item.nama || "Nama tidak ditemukan";
    item.kelas=data.kelas || item.kelas || "";
    item.time=data.waktu || item.time || "";
    item.status=data.status || item.status || "";
    item.message=data.message || item.message || "";

    if(data.duplicate){
      item.duplicate=true;
      item.status="duplicate";
    }
  }else{
    attendanceHistory.unshift({
      nisn:nisn,
      nama:data.nama || "Nama tidak ditemukan",
      kelas:data.kelas || "",
      time:data.waktu || new Date().toLocaleTimeString("id-ID",{
        hour:"2-digit",minute:"2-digit",second:"2-digit"
      }),
      status:data.duplicate ? "duplicate" : (data.status || ""),
      message:data.message || "",
      duplicate:!!data.duplicate
    });
  }

  saveHistory();
  renderHistory();

  const resultText=document.getElementById("resultText");
  if(data.duplicate){
    resultText.textContent=
      "⚠ Sudah Absen" +
      (data.nama ? " • " + data.nama : "") +
      (data.kelas ? " • " + data.kelas : "");

    setStatus(
      "⚠ Sudah Absen",
      data.message || "Siswa ini sudah tercatat hari ini."
    );

  }else if(data.success){
    resultText.textContent=(data.nama || "Siswa")+" • "+(data.kelas || "Kelas");
    setStatus(
      "✓ "+(data.message || "Absensi berhasil dicatat."),
      "Kamera tetap aktif. Silakan scan siswa berikutnya."
    );
  }else{
    resultText.textContent=data.message || "Absensi gagal";
    setStatus(
      "QR terbaca",
      "Periksa pesan hasil absensi."
    );
  }

  processing=false;
});

window.addEventListener("beforeunload",function(){
  if(qrScanner){
    try{qrScanner.stop();}catch(e){}
  }
});

setInterval(function(){
  const newToday=getTodayKey();

  if(newToday!==todayKey){
    todayKey=newToday;
    historyKey="absensi_history_"+todayKey;
    attendanceHistory=loadHistory();
    renderHistory();
  }
},60000);

renderHistory();

// Beri tahu index.html bahwa scanner sudah siap menerima hasil.
function notifyScannerReady(){
  if(window.opener && !window.opener.closed){
    try{
      window.opener.postMessage({
        type:"ABSENSI_SCANNER_READY"
      },"*");
    }catch(e){
      console.warn("Gagal memberi tahu index bahwa scanner siap:",e);
    }
  }
}

notifyScannerReady();
startScanner();
</script>
</body>
</html>
