<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Scanner QR Kehadiran</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

/* =========================================================
   DASAR
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:#0b1220;
  color:#fff;
  font-family:Arial,sans-serif;
}


/* =========================================================
   CONTAINER
   DIPERKECIL AGAR MIRIP KARTU DI HALAMAN UTAMA
========================================================= */

.wrap{

  width:100%;

  max-width:430px;

  margin:0 auto;

  padding:14px;

}


/* =========================================================
   HEADER
========================================================= */

.header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:12px;

}

.header-left{
  min-width:0;
}

h1{

  font-size:19px;

  line-height:1.2;

  margin:0;

}

.sub{

  font-size:11px;

  color:#94a3b8;

  margin-top:4px;

}


button{

  border:0;

  border-radius:10px;

  padding:9px 12px;

  font-weight:bold;

  cursor:pointer;

}

#back{

  background:#1e293b;

  color:white;

  font-size:11px;

}


/* =========================================================
   KAMERA
========================================================= */

.camera-card{

  width:100%;

  background:#111827;

  border:1px solid #334155;

  border-radius:16px;

  padding:8px;

}

#reader{

  width:100%;

}

#reader video{

  width:100%!important;

  max-width:100%!important;

  display:block;

  border-radius:10px;

}


/* =========================================================
   STATUS
========================================================= */

.status{

  margin-top:10px;

  text-align:center;

  padding:10px;

  background:#111827;

  border:1px solid #1e293b;

  border-radius:12px;

}

#status{

  font-size:13px;

  font-weight:bold;

}

#hint{

  font-size:11px;

  color:#94a3b8;

  margin-top:4px;

}


/* =========================================================
   ERROR
========================================================= */

#error{

  display:none;

  margin-top:10px;

  padding:11px;

  border-radius:11px;

  background:#451a1a;

  border:1px solid #7f1d1d;

  color:#fecaca;

  font-size:12px;

  text-align:center;

}

#retry{

  display:none;

  width:100%;

  margin-top:8px;

  background:#dc2626;

  color:white;

}


/* =========================================================
   HASIL SCAN
========================================================= */

.result-section{

  margin-top:14px;

}


/* HEADER HISTORY */

.result-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:8px;

}

.result-title{

  font-size:14px;

  font-weight:bold;

}

.result-count{

  font-size:10px;

  color:#94a3b8;

}


/* =========================================================
   KOTAK HISTORY
   TINGGI CUKUP UNTUK 4 KARTU
========================================================= */

.results-box{

  height:270px;

  overflow-y:auto;

  overflow-x:hidden;

  padding:7px;

  background:#0f172a;

  border:1px solid #1e293b;

  border-radius:14px;

}


/* =========================================================
   GRID 2 x 2
   4 KARTU TERLIHAT
========================================================= */

.results-grid{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:8px;

}


/* =========================================================
   KARTU HASIL
========================================================= */

.scan-card{

  min-width:0;

  min-height:112px;

  padding:10px;

  background:#111827;

  border:1px solid #334155;

  border-radius:12px;

  display:flex;

  flex-direction:column;

  justify-content:space-between;

}


/* SCAN TERBARU */

.scan-card.latest{

  border-color:#10b981;

  box-shadow:
    0 0 0 1px rgba(16,185,129,.12);

}


/* DUPLIKAT */

.scan-card.duplicate{

  border-color:#92400e;

}


/* =========================================================
   IKON
========================================================= */

.scan-icon{

  width:28px;

  height:28px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:8px;

  background:#064e3b;

  color:#6ee7b7;

  font-size:15px;

  margin-bottom:6px;

}

.scan-card.duplicate .scan-icon{

  background:#451a03;

  color:#fbbf24;

}


/* =========================================================
   NAMA
========================================================= */

.scan-name{

  font-size:12px;

  font-weight:bold;

  color:#fff;

  line-height:1.25;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


/* =========================================================
   KELAS
========================================================= */

.scan-class{

  font-size:10px;

  color:#cbd5e1;

  margin-top:3px;

}


/* =========================================================
   NISN
========================================================= */

.scan-nisn{

  font-size:9px;

  color:#64748b;

  margin-top:3px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


/* =========================================================
   WAKTU
========================================================= */

.scan-time{

  font-size:9px;

  color:#94a3b8;

  margin-top:4px;

}


/* =========================================================
   STATUS KECIL
========================================================= */

.scan-status{

  display:inline-block;

  margin-top:5px;

  font-size:9px;

  font-weight:bold;

  padding:3px 6px;

  border-radius:999px;

  background:#064e3b;

  color:#a7f3d0;

  width:max-content;

}

.scan-card.duplicate .scan-status{

  background:#451a03;

  color:#fde68a;

}


/* =========================================================
   KOSONG
========================================================= */

.empty-result{

  min-height:250px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#64748b;

  padding:15px;

  grid-column:1 / -1;

}

.empty-icon{

  font-size:28px;

  margin-bottom:7px;

}

.empty-title{

  font-size:12px;

  font-weight:bold;

  color:#94a3b8;

}

.empty-sub{

  font-size:10px;

  margin-top:3px;

}


/* =========================================================
   SCROLLBAR
========================================================= */

.results-box::-webkit-scrollbar{

  width:5px;

}

.results-box::-webkit-scrollbar-track{

  background:#0f172a;

}

.results-box::-webkit-scrollbar-thumb{

  background:#334155;

  border-radius:10px;

}


/* =========================================================
   HP KECIL
========================================================= */

@media(max-width:380px){

  .wrap{

    padding:10px;

  }

  h1{

    font-size:17px;

  }

  .scan-card{

    min-height:105px;

    padding:8px;

  }

}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  .wrap{

    max-width:430px;

  }

}

</style>

</head>


<body>


<div class="wrap">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <div class="header">

    <div class="header-left">

      <h1>
        📷 Scan QR Kehadiran
      </h1>

      <div class="sub">
        Arahkan QR siswa ke kamera
      </div>

    </div>


    <button id="back">
      Kembali
    </button>

  </div>


  <!-- =====================================================
       KAMERA
  ====================================================== -->

  <div class="camera-card">

    <div id="reader"></div>

  </div>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <div class="status">

    <div id="status">
      Membuka kamera...
    </div>

    <div id="hint">
      Izinkan akses kamera jika diminta.
    </div>

  </div>


  <!-- =====================================================
       ERROR
  ====================================================== -->

  <div id="error"></div>


  <button id="retry">
    Coba Lagi
  </button>


  <!-- =====================================================
       HISTORY ABSENSI
  ====================================================== -->

  <div class="result-section">


    <div class="result-header">

      <div class="result-title">
        📋 Absensi Hari Ini
      </div>

      <div
        class="result-count"
        id="resultCount"
      >
        0 siswa
      </div>

    </div>


    <!-- ===================================================
         AREA SCROLL
         ================================================== -->

    <div class="results-box">

      <div
        class="results-grid"
        id="resultsGrid"
      >

        <div
          class="empty-result"
          id="emptyResult"
        >

          <div class="empty-icon">
            📋
          </div>

          <div class="empty-title">
            Belum ada hasil scan
          </div>

          <div class="empty-sub">
            Hasil scan akan muncul di sini.
          </div>

        </div>

      </div>

    </div>

  </div>


</div>


<script>

/* =========================================================
   URL WEB APP
========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwIJwq8jk0XX_1KuYEWzMLJXNxdfLOxAfsSUHc91R1BYH4J_TdnRYWjKrR2Mn55pR8K1Q/exec";


/* =========================================================
   VARIABEL
========================================================= */

let qrScanner = null;

let processing = false;


/*
 * History disimpan di browser.
 *
 * Jadi kalau kamera dihentikan,
 * history tetap ada selama halaman scanner
 * masih terbuka.
 */

let scanResults = [];


/* =========================================================
   STATUS
========================================================= */

function status(
  text,
  hint=""
){

  document.getElementById(
    "status"
  ).textContent = text;


  document.getElementById(
    "hint"
  ).textContent = hint;

}


/* =========================================================
   ERROR
========================================================= */

function error(text){

  const e =
    document.getElementById(
      "error"
    );


  e.textContent = text;

  e.style.display = "block";


  document.getElementById(
    "retry"
  ).style.display = "block";

}


/* =========================================================
   CLEAR ERROR
========================================================= */

function clearError(){

  document.getElementById(
    "error"
  ).style.display = "none";


  document.getElementById(
    "retry"
  ).style.display = "none";

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner(){

  if(!qrScanner){

    return;

  }


  try{

    await qrScanner.stop();

  }catch(e){}


  try{

    qrScanner.clear();

  }catch(e){}


  qrScanner = null;

}


/* =========================================================
   AMBIL NISN DARI QR
========================================================= */

function getNisn(raw){

  const text =
    String(
      raw || ""
    ).trim();


  if(!text){

    return "";

  }


  try{

    const u =
      new URL(text);


    return (

      u.searchParams.get(
        "nisn"
      ) ||

      u.searchParams.get(
        "NISN"
      ) ||

      text

    ).trim();


  }catch(e){

    return text;

  }

}


/* =========================================================
   START SCANNER
========================================================= */

async function startScanner(){

  processing = false;

  clearError();


  document.getElementById(
    "result"
  );


  status(
    "Membuka kamera...",
    "Izinkan akses kamera jika diminta."
  );


  await stopScanner();


  if(
    typeof Html5Qrcode ===
    "undefined"
  ){

    error(
      "Library scanner gagal dimuat. Pastikan koneksi internet aktif."
    );

    return;

  }


  qrScanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps:10,


    qrbox:(w,h)=>{

      const s =
        Math.max(
          180,
          Math.floor(
            Math.min(w,h) * 0.7
          )
        );


      return {

        width:s,

        height:s

      };

    }

  };


  try{

    await qrScanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScan,

      ()=>{}

    );


    status(

      "Kamera siap",

      "Arahkan QR siswa ke kotak scanner."

    );


  }catch(first){

    try{

      const cams =
        await Html5Qrcode
          .getCameras();


      if(
        !cams.length
      ){

        throw new Error(
          "Kamera tidak ditemukan"
        );

      }


      await qrScanner.start(

        cams[0].id,

        config,

        onScan,

        ()=>{}

      );


      status(

        "Kamera siap",

        "Arahkan QR siswa ke kotak scanner."

      );


    }catch(err){

      const msg =
        String(
          err?.message ||
          err ||
          ""
        );


      if(
        /NotAllowed|Permission/i
          .test(msg)
      ){

        error(
          "Akses kamera ditolak. Izinkan kamera untuk halaman ini lalu tekan Coba Lagi."
        );

      }

      else if(
        /NotFound/i.test(msg)
      ){

        error(
          "Kamera tidak ditemukan pada perangkat."
        );

      }

      else{

        error(
          "Kamera tidak dapat dibuka. Pastikan halaman dibuka melalui HTTPS."
        );

      }

    }

  }

}


/* =========================================================
   TAMBAH HASIL SCAN
========================================================= */

function addScanResult(

  nisn,

  nama="",

  kelas="",

  waktu="",

  duplicate=false,

  statusText="Hadir"

){


  /*
   * Jangan masukkan siswa yang sama
   * dua kali ke history kalau memang
   * scan ulang.
   */

  const existingIndex =
    scanResults.findIndex(
      item =>
        String(item.nisn) ===
        String(nisn)
    );


  if(
    existingIndex >= 0
  ){

    /*
     * Update informasi siswa.
     */

    scanResults[
      existingIndex
    ] = {

      nisn:nisn,

      nama:
        nama ||
        scanResults[
          existingIndex
        ].nama,

      kelas:
        kelas ||
        scanResults[
          existingIndex
        ].kelas,

      waktu:
        waktu ||
        scanResults[
          existingIndex
        ].waktu,

      duplicate:

        duplicate,

      status:

        statusText ||
        "Hadir"

    };


  }else{

    /*
     * Siswa baru.
     */

    scanResults.unshift({

      nisn:nisn,

      nama:nama,

      kelas:kelas,

      waktu:
        waktu ||
        new Date()
          .toLocaleTimeString(
            "id-ID",
            {
              hour:"2-digit",
              minute:"2-digit",
              second:"2-digit"
            }
          ),

      duplicate:duplicate,

      status:
        statusText ||
        "Hadir"

    });

  }


  renderResults();


  /*
   * Simpan history di browser.
   */

  saveHistory();

}


/* =========================================================
   SIMPAN HISTORY
========================================================= */

function saveHistory(){

  try{

    const today =
      new Date()
        .toISOString()
        .slice(0,10);


    localStorage.setItem(

      "scanner_absensi_history_" +
      today,

      JSON.stringify(
        scanResults
      )

    );


  }catch(e){

    console.warn(
      "History tidak dapat disimpan:",
      e
    );

  }

}


/* =========================================================
   LOAD HISTORY
========================================================= */

function loadHistory(){

  try{

    const today =
      new Date()
        .toISOString()
        .slice(0,10);


    const saved =
      localStorage.getItem(

        "scanner_absensi_history_" +
        today

      );


    if(saved){

      const data =
        JSON.parse(
          saved
        );


      if(
        Array.isArray(data)
      ){

        scanResults =
          data;

      }

    }


  }catch(e){

    scanResults = [];

  }


  renderResults();

}


/* =========================================================
   TAMPILKAN HISTORY
========================================================= */

function renderResults(){

  const grid =
    document.getElementById(
      "resultsGrid"
    );


  const count =
    document.getElementById(
      "resultCount"
    );


  count.textContent =
    scanResults.length +
    " siswa";


  grid.innerHTML = "";


  if(
    scanResults.length === 0
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty-result";


    empty.innerHTML = `

      <div class="empty-icon">
        📋
      </div>

      <div class="empty-title">
        Belum ada hasil scan
      </div>

      <div class="empty-sub">
        Hasil scan akan muncul di sini.
      </div>

    `;


    grid.appendChild(
      empty
    );


    return;

  }


  scanResults.forEach(

    (item,index)=>{

      grid.appendChild(

        createScanCard(

          item,

          index === 0

        )

      );

    }

  );

}


/* =========================================================
   BUAT KARTU
========================================================= */

function createScanCard(

  item,

  latest=false

){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "scan-card" +

    (
      latest
        ? " latest"
        : ""
    ) +

    (
      item.duplicate
        ? " duplicate"
        : ""
    );


  const icon =
    item.duplicate
      ? "⚠️"
      : "✓";


  const nama =
    item.nama ||
    "Siswa";


  const kelas =
    item.kelas ||
    "-";


  const nisn =
    item.nisn ||
    "-";


  const waktu =
    item.waktu ||
    "-";


  const statusText =
    item.duplicate
      ? "Sudah Absen"
      : (
          item.status ||
          "Hadir"
        );


  card.innerHTML = `

    <div>

      <div class="scan-icon">

        ${icon}

      </div>


      <div class="scan-name">

        ${escapeHtml(nama)}

      </div>


      <div class="scan-class">

        Kelas:
        ${escapeHtml(kelas)}

      </div>


      <div class="scan-nisn">

        NISN:
        ${escapeHtml(nisn)}

      </div>


      <div class="scan-time">

        🕐 ${escapeHtml(waktu)}

      </div>

    </div>


    <div>

      <span class="scan-status">

        ${escapeHtml(statusText)}

      </span>

    </div>

  `;


  return card;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      text || ""
    );


  return div.innerHTML;

}


/* =========================================================
   QR BERHASIL DIBACA
========================================================= */

async function onScan(
  decodedText
){

  if(processing){

    return;

  }


  const nisn =
    getNisn(
      decodedText
    );


  if(!nisn){

    return;

  }


  processing = true;


  status(

    "QR berhasil dibaca",

    "Mengirim data ke aplikasi..."

  );


  await stopScanner();


  /*
   * KIRIM KE INDEX UTAMA
   *
   * JANGAN DIUBAH.
   *
   * Ini adalah format yang sudah
   * berhasil kita gunakan.
   */

  if(

    window.opener &&

    !window.opener.closed

  ){

    try{

      window.opener.postMessage(

        {

          type:
            "ABSENSI_QR",

          value:
            nisn

        },

        "*"

      );


      /*
       * Kita belum langsung menutup
       * halaman.
       *
       * Jadi hasil/history bisa
       * tetap terlihat.
       */

      status(

        "QR berhasil dikirim",

        "Menunggu aplikasi mencatat absensi..."

      );


      /*
       * Beri waktu index memproses QR.
       */

      setTimeout(

        ()=>{

          /*
           * Scanner tidak langsung ditutup.
           *
           * Pengguna masih bisa melihat
           * history hasil scan.
           */

          processing = false;

        },

        1200

      );


    }catch(e){

      error(

        "QR berhasil dibaca, tetapi gagal mengirim data ke aplikasi utama."

      );


      processing = false;

    }


  }else{

    /*
     * Popup dibuka langsung,
     * bukan dari aplikasi utama.
     */

    error(

      "Jendela aplikasi utama tidak ditemukan. Buka scanner melalui tombol Scan QR di aplikasi absensi."

    );


    processing = false;

  }

}


/* =========================================================
   TOMBOL COBA LAGI
========================================================= */

document
  .getElementById(
    "retry"
  )
  .onclick =
    startScanner;


/* =========================================================
   TOMBOL KEMBALI
========================================================= */

document
  .getElementById(
    "back"
  )
  .onclick =

  async()=>{

    await stopScanner();


    /*
     * Kembali ke halaman sebelumnya.
     */

    if(
      history.length > 1
    ){

      history.back();

    }

    else{

      window.location.href =
        APPS_SCRIPT_URL;

    }

  };


/* =========================================================
   SAAT HALAMAN DITUTUP
========================================================= */

window.addEventListener(

  "beforeunload",

  stopScanner

);


/* =========================================================
   MULAI
========================================================= */

loadHistory();

startScanner();

</script>


</body>

</html>
