<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scanner QR Kehadiran</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:auto;padding:14px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:19px;margin:0}.sub{font-size:12px;color:#94a3b8;margin-top:4px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:bold;cursor:pointer}
#back{background:#1e293b;color:#fff}
.card{background:#111827;border:1px solid #334155;border-radius:16px;padding:9px}
#reader{width:100%}
#reader video{width:100%!important;border-radius:11px}
.status{margin-top:10px;text-align:center;padding:11px;background:#111827;border-radius:12px}
#hint{font-size:11px;color:#94a3b8;margin-top:4px}
#error{display:none;margin-top:10px;padding:11px;border-radius:11px;background:#451a1a;color:#fecaca;font-size:12px}
#retry{display:none;width:100%;margin-top:9px;background:#dc2626;color:#fff}
#result{display:none;margin-top:10px;text-align:center;padding:12px;border-radius:12px;background:#052e1b;border:1px solid #166534}
#resultText{font-weight:bold;font-size:13px}
.history-wrap{margin-top:12px;background:#111827;border:1px solid #334155;border-radius:16px;padding:11px}
.history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.history-title{font-size:14px;font-weight:bold}
.history-count{font-size:11px;color:#94a3b8}
.history-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:300px;overflow-y:auto;padding-right:2px}
.history-card{background:#0f172a;border:1px solid #334155;border-radius:11px;padding:9px;min-height:88px}
.history-name{font-size:12px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-nisn{font-size:10px;color:#94a3b8;margin-top:4px;word-break:break-all}
.history-time{font-size:10px;color:#94a3b8;margin-top:4px}
.empty-history{grid-column:1/-1;text-align:center;color:#64748b;padding:18px 8px;font-size:11px}
@media(max-width:380px){
  .wrap{padding:10px}
  .history-list{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>📷 Scan QR Kehadiran</h1>
      <div class="sub">Arahkan QR siswa ke kamera</div>
    </div>
    <button id="back" type="button">Kembali</button>
  </div>

  <div class="card">
    <div id="reader"></div>
  </div>

  <div class="status">
    <div id="status">Membuka kamera...</div>
    <div id="hint">Izinkan akses kamera jika diminta.</div>
  </div>

  <div id="error"></div>
  <button id="retry" type="button">Coba Lagi</button>

  <div id="result">
    <div style="font-size:26px">✓</div>
    <div id="resultText"></div>
  </div>

  <div class="history-wrap">
    <div class="history-head">
      <div class="history-title">📋 Absensi Hari Ini</div>
      <div id="historyCount" class="history-count">0 siswa</div>
    </div>
    <div id="historyList" class="history-list"></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIJwq8jk0XX_1KuYEWzMLJXNxdfLOxAfsSUHc91R1BYH4J_TdnRYWjKrR2Mn55pR8K1Q/exec";

let qrScanner = null;
let processing = false;
let todayKey = getTodayKey();
let historyKey = "absensi_history_" + todayKey;
let attendanceHistory = loadHistory();

function getTodayKey(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function setStatus(text,hint){
  document.getElementById("status").textContent=text;
  document.getElementById("hint").textContent=hint || "";
}

function showError(text){
  const e=document.getElementById("error");
  e.textContent=text;
  e.style.display="block";
  document.getElementById("retry").style.display="block";
}

function clearError(){
  document.getElementById("error").style.display="none";
  document.getElementById("retry").style.display="none";
}

function loadHistory(){
  try{
    const raw=localStorage.getItem(historyKey);
    if(!raw)return [];
    const parsed=JSON.parse(raw);
    return Array.isArray(parsed)?parsed:[];
  }catch(e){
    console.warn("History tidak dapat dibaca:",e);
    return [];
  }
}

function saveHistory(){
  try{
    localStorage.setItem(historyKey,JSON.stringify(attendanceHistory));
  }catch(e){
    console.warn("History tidak dapat disimpan:",e);
  }
}

function escapeHtml(value){
  const el=document.createElement("div");
  el.textContent=String(value==null?"":value);
  return el.innerHTML;
}

function renderHistory(){
  const list=document.getElementById("historyList");
  document.getElementById("historyCount").textContent=attendanceHistory.length+" siswa";

  if(!attendanceHistory.length){
    list.innerHTML='<div class="empty-history">Belum ada siswa yang discan hari ini.</div>';
    return;
  }

  list.innerHTML=attendanceHistory.map(function(item){
    return `
      <div class="history-card">
        <div class="history-name">${escapeHtml(item.nama || "Siswa")}</div>
        <div class="history-nisn">NISN: ${escapeHtml(item.nisn)}</div>
        <div class="history-time">🕐 ${escapeHtml(item.time)}</div>
      </div>`;
  }).join("");
}

function addHistory(nisn){
  if(attendanceHistory.some(function(item){return item.nisn===nisn;})){
    return false;
  }

  attendanceHistory.unshift({
    nisn:nisn,
    nama:"Siswa",
    time:new Date().toLocaleTimeString("id-ID",{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    })
  });

  saveHistory();
  renderHistory();
  return true;
}

function getNisn(raw){
  const text=String(raw||"").trim();
  if(!text)return "";

  try{
    const url=new URL(text);
    return String(
      url.searchParams.get("nisn") ||
      url.searchParams.get("NISN") ||
      text
    ).trim();
  }catch(e){
    return text;
  }
}

async function stopScanner(){
  const scanner=qrScanner;
  qrScanner=null;

  if(!scanner)return;

  try{await scanner.stop();}catch(e){}
  try{scanner.clear();}catch(e){}
}

async function startScanner(){
  processing=false;
  clearError();
  document.getElementById("result").style.display="none";

  setStatus("Membuka kamera...","Izinkan akses kamera jika diminta.");

  await stopScanner();

  if(typeof Html5Qrcode!=="function"){
    showError("Library scanner gagal dimuat. Pastikan internet aktif lalu tekan Coba Lagi.");
    return;
  }

  const scanner=new Html5Qrcode("reader");
  qrScanner=scanner;

  const config={
    fps:10,
    qrbox:function(w,h){
      const size=Math.max(180,Math.floor(Math.min(w,h)*0.7));
      return {width:size,height:size};
    }
  };

  try{
    await scanner.start(
      {facingMode:"environment"},
      config,
      onScan,
      function(){}
    );

    if(qrScanner===scanner){
      setStatus("Kamera siap","Arahkan QR siswa ke kotak scanner.");
    }
    return;

  }catch(firstError){
    console.warn("Kamera environment gagal:",firstError);
  }

  try{
    const cameras=await Html5Qrcode.getCameras();

    if(!cameras || !cameras.length){
      throw new Error("NotFoundError");
    }

    await scanner.start(
      cameras[0].id,
      config,
      onScan,
      function(){}
    );

    if(qrScanner===scanner){
      setStatus("Kamera siap","Arahkan QR siswa ke kotak scanner.");
    }

  }catch(err){
    const msg=String(err && (err.message || err.name) || err || "");

    if(/NotAllowed|Permission|denied/i.test(msg)){
      showError("Akses kamera ditolak. Izinkan kamera untuk halaman scanner ini lalu tekan Coba Lagi.");
    }else if(/NotFound|No camera/i.test(msg)){
      showError("Kamera tidak ditemukan pada perangkat.");
    }else{
      showError("Kamera tidak dapat dibuka. Pastikan scanner dibuka melalui HTTPS.");
      console.error("Detail kamera:",err);
    }
  }
}

async function onScan(decodedText){
  if(processing)return;

  const nisn=getNisn(decodedText);
  if(!nisn)return;

  processing=true;

  const isNew=addHistory(nisn);

  document.getElementById("result").style.display="block";
  document.getElementById("resultText").textContent=
    isNew ? "NISN terbaca: "+nisn : "NISN "+nisn+" sudah ada di Absensi Hari Ini";

  /*
   * INI HARUS SAMA DENGAN INDEX:
   * type = ABSENSI_QR
   * value = NISN
   */
  let sent=false;

  if(window.opener && !window.opener.closed){
    try{
      window.opener.postMessage(
        {
          type:"ABSENSI_QR",
          value:nisn
        },
        "*"
      );
      sent=true;
    }catch(e){
      console.error("postMessage gagal:",e);
    }
  }

  if(sent){
    setStatus(
      isNew ? "QR berhasil dibaca ✓" : "Siswa sudah tercatat",
      "Data dikirim. Kamera tetap aktif. Scan siswa berikutnya."
    );
  }else{
    setStatus(
      "QR terbaca ✓",
      "Popup tidak terhubung ke halaman utama. Jangan tutup scanner ini."
    );
    showError("Scanner tidak menemukan halaman index sebagai pembuka popup. Tutup scanner dan buka kembali dari tombol Buka Kamera Scanner di index.");
  }

  /*
   * Jangan stopScanner().
   * Jangan window.close().
   */
  setTimeout(function(){
    processing=false;
    clearError();

    setStatus(
      "Kamera siap",
      "Arahkan QR siswa berikutnya ke kotak scanner."
    );
  },1200);
}

document.getElementById("retry").addEventListener("click",function(){
  startScanner();
});

document.getElementById("back").addEventListener("click",async function(){
  await stopScanner();

  if(window.opener && !window.opener.closed){
    try{window.close();}catch(e){}
  }else{
    window.location.href=APPS_SCRIPT_URL;
  }
});

window.addEventListener("beforeunload",function(){
  if(qrScanner){
    try{qrScanner.stop();}catch(e){}
  }
});

setInterval(function(){
  const newToday=getTodayKey();

  if(newToday!==todayKey){
    todayKey=newToday;
    historyKey="absensi_history_"+todayKey;
    attendanceHistory=loadHistory();
    renderHistory();
  }
},60000);

renderHistory();
startScanner();
</script>
</body>
</html>
