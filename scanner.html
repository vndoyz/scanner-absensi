<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scanner QR Kehadiran - SDN 8 Mentok</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
:root{
  --red:#dc2626;
  --blue:#1d4ed8;
  --bg:#05060a;
  --panel:#11131d;
  --panel2:#08090f;
  --border:rgba(148,163,184,.14);
  --muted:#94a3b8;
  --green:#22c55e;
  --yellow:#f59e0b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#05060a;
  color:#fff;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background-image:
    radial-gradient(
      circle at 12% 15%,
      rgba(220,38,38,.18),
      transparent 42%
    ),
    radial-gradient(
      circle at 88% 85%,
      rgba(29,78,216,.22),
      transparent 46%
    ),
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 64px
    ),
    repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,.025) 0,
      rgba(255,255,255,.025) 1px,
      transparent 1px,
      transparent 64px
    );
  background-attachment:fixed;
  background-size:cover;
  min-height:100vh;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  font-family:inherit;
  font-weight:700;
  cursor:pointer;
  transition:.18s ease;
}

button:active{
  transform:scale(.97);
}

.wrap{
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:16px;
}

/* ================================
   HEADER
================================ */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

h1{
  margin:0;
  font-size:20px;
  font-weight:800;
}

.sub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

#back{
  color:#fff;
  background:linear-gradient(
    135deg,
    rgba(220,38,38,.9),
    rgba(29,78,216,.9)
  );
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}

/* ================================
   CARD
================================ */

.card,
.status,
.history-wrap,
.result{
  background:
    linear-gradient(
      180deg,
      rgba(17,19,29,.96),
      rgba(8,9,15,.98)
    );

  border:1px solid var(--border);

  box-shadow:
    0 12px 30px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.025);

  backdrop-filter:blur(10px);
}

.card{
  border-radius:18px;
  padding:10px;
  overflow:hidden;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:12px;
}

#reader video{
  width:100%!important;
  height:auto!important;
  min-height:250px;
  object-fit:cover;
  border-radius:12px!important;
}

#reader__scan_region{
  border-radius:12px;
  overflow:hidden;
}

#reader__dashboard{
  color:#cbd5e1!important;
  padding-top:8px!important;
}

#reader__dashboard button{
  color:#fff!important;
  background:
    linear-gradient(
      120deg,
      var(--red),
      var(--blue)
    )!important;
  border:0!important;
  border-radius:9px!important;
}

#reader__dashboard select{
  background:#11131d!important;
  color:#fff!important;
  border:1px solid rgba(148,163,184,.2)!important;
  border-radius:8px!important;
}

/* ================================
   STATUS
================================ */

.status{
  margin-top:12px;
  text-align:center;
  padding:12px;
  border-radius:14px;
}

#status{
  font-size:13px;
  font-weight:700;
}

#hint{
  font-size:10px;
  color:var(--muted);
  margin-top:5px;
}

/* ================================
   ERROR
================================ */

#error{
  display:none;
  margin-top:10px;
  padding:11px;
  border-radius:12px;
  background:rgba(127,29,29,.35);
  border:1px solid rgba(248,113,113,.22);
  color:#fecaca;
  font-size:12px;
}

#retry{
  display:none;
  width:100%;
  margin-top:9px;
  color:#fff;
  background:
    linear-gradient(
      120deg,
      var(--red),
      var(--blue)
    );
}

/* ================================
   RESULT
================================ */

.result{
  display:none;
  margin-top:12px;
  text-align:center;
  padding:14px;
  border-radius:14px;
}

.result.success{
  border-color:rgba(34,197,94,.35);
}

.result.warning{
  border-color:rgba(245,158,11,.4);
}

.result.error{
  border-color:rgba(239,68,68,.4);
}

#resultIcon{
  font-size:28px;
  margin-bottom:5px;
}

#resultText{
  font-weight:800;
  font-size:14px;
  line-height:1.5;
}

#resultDetail{
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

/* ================================
   HISTORY
================================ */

.history-wrap{
  margin-top:12px;
  border-radius:18px;
  padding:12px;
}

.history-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}

.history-title{
  font-size:14px;
  font-weight:800;
}

.history-count{
  font-size:10px;
  color:var(--muted);
}

.history-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  max-height:300px;
  overflow-y:auto;
  padding-right:2px;
}

.history-card{
  position:relative;
  background:
    linear-gradient(
      180deg,
      rgba(17,19,29,.95),
      rgba(8,9,15,.98)
    );

  border:1px solid rgba(148,163,184,.12);
  border-radius:12px;
  padding:9px;
  min-height:92px;
}

.history-card.duplicate{
  border-color:rgba(245,158,11,.35);
}

.history-name{
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-class{
  font-size:10px;
  color:#cbd5e1;
  margin-top:4px;
}

.history-nisn{
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
  word-break:break-all;
}

.history-time{
  font-size:10px;
  color:var(--muted);
  margin-top:4px;
}

.history-status{
  display:inline-block;
  margin-top:5px;
  font-size:9px;
  font-weight:800;
  padding:3px 6px;
  border-radius:6px;
  background:rgba(34,197,94,.12);
  color:#86efac;
}

.history-card.duplicate .history-status{
  background:rgba(245,158,11,.12);
  color:#fcd34d;
}

.empty-history{
  grid-column:1/-1;
  text-align:center;
  color:#64748b;
  padding:18px 8px;
  font-size:11px;
}

.history-list::-webkit-scrollbar{
  width:5px;
}

.history-list::-webkit-scrollbar-track{
  background:rgba(255,255,255,.02);
}

.history-list::-webkit-scrollbar-thumb{
  background:
    linear-gradient(
      var(--red),
      var(--blue)
    );
  border-radius:20px;
}

/* ================================
   HP
================================ */

@media(max-width:380px){

  .wrap{
    padding:10px;
  }

  h1{
    font-size:18px;
  }

  .history-list{
    grid-template-columns:1fr;
  }

  #reader video{
    min-height:220px;
  }
}

@media(orientation:landscape) and (max-height:600px){

  .wrap{
    max-width:700px;
    padding:8px 14px;
  }

  .history-list{
    max-height:180px;
  }

  #reader video{
    max-height:48vh;
    object-fit:cover;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">

    <div>
      <h1>📷 Scan QR Kehadiran</h1>
      <div class="sub">
        Arahkan QR siswa ke kamera
      </div>
    </div>

    <button id="back" type="button">
      Kembali
    </button>

  </div>


  <!-- SCANNER -->

  <div class="card">
    <div id="reader"></div>
  </div>


  <!-- STATUS -->

  <div class="status">
    <div id="status">
      Membuka kamera...
    </div>

    <div id="hint">
      Izinkan akses kamera jika diminta.
    </div>
  </div>


  <!-- ERROR -->

  <div id="error"></div>

  <button id="retry" type="button">
    Coba Lagi
  </button>


  <!-- HASIL SCAN -->

  <div id="result" class="result">

    <div id="resultIcon">
      ✓
    </div>

    <div id="resultText"></div>

    <div id="resultDetail"></div>

  </div>


  <!-- HISTORY -->

  <div class="history-wrap">

    <div class="history-head">

      <div class="history-title">
        📋 Absensi Hari Ini
      </div>

      <div id="historyCount" class="history-count">
        0 siswa
      </div>

    </div>

    <div id="historyList" class="history-list"></div>

  </div>

</div>


<script>

/* ============================================================
   KONFIGURASI
============================================================ */

let qrScanner = null;

let processing = false;

let todayKey = getTodayKey();

let historyKey = "absensi_history_" + todayKey;

/*
 * History hanya berisi hasil yang sudah mendapatkan
 * jawaban dari index.html.
 *
 * TIDAK ADA LAGI:
 * nama:"Siswa"
 */

let attendanceHistory = loadHistory();


/* ============================================================
   TANGGAL
============================================================ */

function getTodayKey(){

  const d = new Date();

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth()+1).padStart(2,"0") +
    "-" +
    String(d.getDate()).padStart(2,"0")
  );

}


/* ============================================================
   STATUS
============================================================ */

function setStatus(text,hint){

  document.getElementById("status").textContent =
    text || "";

  document.getElementById("hint").textContent =
    hint || "";

}


function showError(text){

  const error =
    document.getElementById("error");

  error.textContent =
    text || "Terjadi kesalahan.";

  error.style.display =
    "block";

  document.getElementById("retry").style.display =
    "block";

}


function clearError(){

  document.getElementById("error").style.display =
    "none";

  document.getElementById("retry").style.display =
    "none";

}


/* ============================================================
   HASIL SCAN
============================================================ */

function showResult(type,title,detail){

  const box =
    document.getElementById("result");

  const icon =
    document.getElementById("resultIcon");

  const text =
    document.getElementById("resultText");

  const detailEl =
    document.getElementById("resultDetail");


  box.className =
    "result " + (type || "");


  if(type === "warning"){

    icon.textContent = "⚠";

  }else if(type === "error"){

    icon.textContent = "✕";

  }else{

    icon.textContent = "✓";

  }


  text.textContent =
    title || "";

  detailEl.textContent =
    detail || "";


  box.style.display =
    "block";

}


/* ============================================================
   LOCAL STORAGE
============================================================ */

function loadHistory(){

  try{

    const raw =
      localStorage.getItem(historyKey);

    if(!raw){
      return [];
    }

    const parsed =
      JSON.parse(raw);

    if(!Array.isArray(parsed)){
      return [];
    }

    /*
     * Bersihkan placeholder dari versi scanner lama.
     *
     * Jadi kalau hari ini sebelumnya sudah ada:
     *
     * nama:"Siswa"
     *
     * kartu tersebut tidak dipertahankan.
     */

    return parsed.filter(function(item){

      return (
        item &&
        item.nisn &&
        item.nama &&
        item.nama !== "Siswa"
      );

    });

  }catch(error){

    console.warn(
      "History tidak dapat dibaca:",
      error
    );

    return [];

  }

}


function saveHistory(){

  try{

    localStorage.setItem(
      historyKey,
      JSON.stringify(attendanceHistory)
    );

  }catch(error){

    console.warn(
      "History tidak dapat disimpan:",
      error
    );

  }

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  const el =
    document.createElement("div");

  el.textContent =
    String(
      value == null ? "" : value
    );

  return el.innerHTML;

}


/* ============================================================
   RENDER HISTORY
============================================================ */

function renderHistory(){

  const list =
    document.getElementById(
      "historyList"
    );

  const count =
    document.getElementById(
      "historyCount"
    );


  count.textContent =
    attendanceHistory.length +
    " siswa";


  if(!attendanceHistory.length){

    list.innerHTML =
      '<div class="empty-history">' +
      'Belum ada siswa yang discan hari ini.' +
      '</div>';

    return;

  }


  list.innerHTML =
    attendanceHistory.map(function(item){

      const duplicate =
        item.duplicate === true;


      return `

        <div class="history-card ${duplicate ? "duplicate" : ""}">

          <div class="history-name">
            ${escapeHtml(
              item.nama ||
              "Nama tidak ditemukan"
            )}
          </div>

          <div class="history-class">
            ${escapeHtml(
              item.kelas ||
              "Kelas belum diketahui"
            )}
          </div>

          <div class="history-nisn">
            NISN: ${escapeHtml(
              item.nisn
            )}
          </div>

          <div class="history-time">
            🕐 ${escapeHtml(
              item.time || "-"
            )}
          </div>

          <div class="history-status">
            ${
              duplicate
              ? "⚠ SUDAH ABSEN"
              : "✓ HADIR"
            }
          </div>

        </div>

      `;

    }).join("");

}


/* ============================================================
   CARI HISTORY
============================================================ */

function findHistoryItem(nisn){

  return attendanceHistory.find(
    function(item){

      return String(item.nisn) ===
             String(nisn);

    }
  );

}


/* ============================================================
   TAMBAH HISTORY
   ------------------------------------------------------------
   PENTING:
   Fungsi ini HANYA dipanggil setelah
   ABSENSI_RESULT diterima.

   Jadi tidak pernah lagi menyimpan:
   nama:"Siswa"
============================================================ */

function addResultToHistory(data){

  const nisn =
    String(data.nisn || "").trim();


  if(!nisn){
    return;
  }


  const nama =
    String(
      data.nama || ""
    ).trim();


  /*
   * Kalau backend belum memberikan nama,
   * jangan masukkan ke history.
   */

  if(!nama){

    console.warn(
      "ABSENSI_RESULT tidak memiliki nama:",
      data
    );

    return;

  }


  const kelas =
    String(
      data.kelas || ""
    ).trim();


  const waktu =
    String(
      data.waktu || ""
    ).trim();


  const existing =
    findHistoryItem(nisn);


  const record = {

    nisn: nisn,

    nama: nama,

    kelas: kelas,

    time:
      waktu ||
      new Date().toLocaleTimeString(
        "id-ID",
        {
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      ),

    status:
      data.duplicate
      ? "duplicate"
      : (
          data.status ||
          "Hadir"
        ),

    message:
      data.message || "",

    duplicate:
      !!data.duplicate

  };


  if(existing){

    /*
     * Kalau sudah ada, update kartu lama.
     */

    Object.assign(
      existing,
      record
    );

  }else{

    /*
     * Kalau belum ada, baru masukkan
     * nama siswa sebenarnya.
     */

    attendanceHistory.unshift(
      record
    );

  }


  saveHistory();

  renderHistory();

}


/* ============================================================
   AMBIL NISN DARI QR
============================================================ */

function getNisn(raw){

  const text =
    String(raw || "").trim();


  if(!text){
    return "";
  }


  try{

    const url =
      new URL(text);


    return String(
      url.searchParams.get("nisn") ||
      url.searchParams.get("NISN") ||
      text
    ).trim();

  }catch(error){

    return text;

  }

}


/* ============================================================
   STOP SCANNER
============================================================ */

async function stopScanner(){

  const scanner =
    qrScanner;

  qrScanner =
    null;


  if(!scanner){
    return;
  }


  try{

    await scanner.stop();

  }catch(error){}


  try{

    scanner.clear();

  }catch(error){}

}


/* ============================================================
   START SCANNER
============================================================ */

async function startScanner(){

  processing =
    false;


  clearError();


  document.getElementById(
    "result"
  ).style.display =
    "none";


  setStatus(
    "Membuka kamera...",
    "Izinkan akses kamera jika diminta."
  );


  await stopScanner();


  if(typeof Html5Qrcode !== "function"){

    showError(
      "Library scanner gagal dimuat. " +
      "Pastikan internet aktif lalu tekan Coba Lagi."
    );

    return;

  }


  const scanner =
    new Html5Qrcode(
      "reader"
    );


  qrScanner =
    scanner;


  const config = {

    fps:10,

    qrbox:function(w,h){

      const size =
        Math.max(
          180,
          Math.floor(
            Math.min(w,h) * 0.7
          )
        );


      return {

        width:size,

        height:size

      };

    }

  };


  /*
   * Kamera belakang terlebih dahulu.
   */

  try{

    await scanner.start(

      {
        facingMode:"environment"
      },

      config,

      onScan,

      function(){}

    );


    if(qrScanner === scanner){

      setStatus(
        "Kamera siap",
        "Arahkan QR siswa ke kotak scanner."
      );

    }

    return;

  }catch(firstError){

    console.warn(
      "Kamera environment gagal:",
      firstError
    );

  }


  /*
   * Fallback ke daftar kamera.
   */

  try{

    const cameras =
      await Html5Qrcode.getCameras();


    if(
      !cameras ||
      !cameras.length
    ){

      throw new Error(
        "NotFoundError"
      );

    }


    await scanner.start(

      cameras[0].id,

      config,

      onScan,

      function(){}

    );


    if(qrScanner === scanner){

      setStatus(
        "Kamera siap",
        "Arahkan QR siswa ke kotak scanner."
      );

    }

  }catch(error){

    const msg =
      String(
        error &&
        (
          error.message ||
          error.name
        ) ||
        error ||
        ""
      );


    if(
      /NotAllowed|Permission|denied/i
      .test(msg)
    ){

      showError(
        "Akses kamera ditolak. " +
        "Izinkan kamera untuk halaman scanner ini lalu tekan Coba Lagi."
      );

    }else if(
      /NotFound|No camera/i
      .test(msg)
    ){

      showError(
        "Kamera tidak ditemukan pada perangkat."
      );

    }else{

      showError(
        "Kamera tidak dapat dibuka. " +
        "Pastikan scanner dibuka melalui HTTPS."
      );

      console.error(
        "Detail kamera:",
        error
      );

    }

  }

}


/* ============================================================
   HASIL SCAN QR
============================================================ */

async function onScan(decodedText){

  if(processing){
    return;
  }


  const nisn =
    getNisn(decodedText);


  if(!nisn){
    return;
  }


  processing =
    true;


  /*
   * PENTING:
   *
   * TIDAK ADA addHistory(nisn) DI SINI.
   *
   * Scanner hanya mengirim NISN.
   *
   * History baru dibuat ketika index.html
   * mengirim ABSENSI_RESULT.
   */


  showResult(
    "success",
    "QR berhasil dibaca",
    "NISN: " + nisn +
    " • Menunggu hasil absensi..."
  );


  setStatus(
    "Memproses absensi...",
    "Mencari nama siswa..."
  );


  /*
   * Kirim NISN ke index.html.
   */

  if(
    window.opener &&
    !window.opener.closed
  ){

    try{

      window.opener.postMessage(

        {
          type:"ABSENSI_QR",
          value:nisn
        },

        "*"

      );


      setStatus(
        "QR berhasil dibaca ✓",
        "Menunggu nama dan hasil absensi..."
      );


    }catch(error){

      console.error(
        "Gagal mengirim NISN ke index:",
        error
      );


      showResult(
        "error",
        "QR terbaca",
        "Gagal mengirim data ke aplikasi utama."
      );


      setStatus(
        "Komunikasi gagal",
        "Silakan buka scanner dari halaman utama."
      );


      processing =
        false;

    }


  }else{

    /*
     * Scanner dibuka langsung tanpa index sebagai opener.
     */

    showResult(
      "error",
      "Scanner dibuka langsung",
      "Buka scanner melalui tombol Scan QR pada halaman utama."
    );


    setStatus(
      "Scanner tidak terhubung",
      "Kembali ke aplikasi utama lalu buka scanner dari sana."
    );


    processing =
      false;

  }

}


/* ============================================================
   TERIMA HASIL DARI INDEX.HTML
============================================================ */

window.addEventListener(
  "message",
  function(event){

    if(
      !event ||
      !event.data ||
      event.data.type !==
        "ABSENSI_RESULT"
    ){

      return;

    }


    const data =
      event.data;


    const nisn =
      String(
        data.nisn || ""
      ).trim();


    if(!nisn){

      processing =
        false;

      return;

    }


    /*
     * ========================================================
     * INI TITIK UTAMA PERBAIKAN
     * ========================================================
     *
     * Nama siswa sekarang berasal dari:
     *
     * data.nama
     *
     * yang dikirim oleh index.html setelah
     * Code.gs mencari NISN.
     */

    addResultToHistory(
      data
    );


    /*
     * DUPLICATE
     */

    if(data.duplicate){

      showResult(

        "warning",

        "⚠ Sudah Absen",

        (
          data.nama
            ? data.nama
            : "Siswa"
        ) +
        (
          data.kelas
            ? " • " + data.kelas
            : ""
        ) +
        (
          data.waktu
            ? " • " + data.waktu
            : ""
        )

      );


      setStatus(

        "⚠ Sudah Absen",

        data.message ||
        "Siswa ini sudah tercatat hari ini."

      );


    /*
     * BERHASIL
     */

    }else if(data.success){

      showResult(

        "success",

        (
          data.nama ||
          "Nama siswa"
        ) +
        (
          data.kelas
            ? " • " + data.kelas
            : ""
        ),

        data.message ||
        (
          data.waktu
            ? "Absensi pukul " +
              data.waktu
            : "Absensi berhasil dicatat."
        )

      );


      setStatus(

        "✓ Absensi berhasil",

        "Nama siswa sudah ditampilkan. Kamera tetap aktif."

      );


    /*
     * GAGAL
     */

    }else{

      showResult(

        "error",

        "Absensi gagal",

        data.message ||
        "Terjadi kesalahan saat mencatat absensi."

      );


      setStatus(

        "QR terbaca",

        "Periksa pesan hasil absensi."

      );

    }


    /*
     * Sudah selesai memproses QR.
     * Kamera tetap hidup.
     */

    processing =
      false;

  }
);


/* ============================================================
   TOMBOL RETRY
============================================================ */

document
  .getElementById("retry")
  .addEventListener(
    "click",
    function(){

      startScanner();

    }
  );


/* ============================================================
   TOMBOL KEMBALI
============================================================ */

document
  .getElementById("back")
  .addEventListener(
    "click",
    async function(){

      await stopScanner();


      if(
        window.opener &&
        !window.opener.closed
      ){

        try{

          window.close();

        }catch(error){}

      }else{

        /*
         * Jika scanner bukan popup,
         * cukup kembali satu halaman.
         */

        if(
          window.history.length > 1
        ){

          window.history.back();

        }

      }

    }
  );


/* ============================================================
   JIKA TANGGAL BERGANTI
============================================================ */

setInterval(
  function(){

    const newToday =
      getTodayKey();


    if(
      newToday !== todayKey
    ){

      todayKey =
        newToday;


      historyKey =
        "absensi_history_" +
        todayKey;


      attendanceHistory =
        loadHistory();


      renderHistory();

    }

  },
  60000
);


/* ============================================================
   BERI TAHU INDEX BAHWA SCANNER SIAP
============================================================ */

function notifyScannerReady(){

  if(
    window.opener &&
    !window.opener.closed
  ){

    try{

      window.opener.postMessage(

        {
          type:
            "ABSENSI_SCANNER_READY"
        },

        "*"

      );

    }catch(error){

      console.warn(
        "Gagal memberi tahu index:",
        error
      );

    }

  }

}


/* ============================================================
   INIT
============================================================ */

renderHistory();

notifyScannerReady();

startScanner();

</script>

</html>
